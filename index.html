<canvas id="c" width="384" height="216"></canvas>
<script>
'use strict';
/* =====================================================================
   STRATECORUM · reglas v2 · baraja propia (corazón, rayo, trébol, moneda)
   Todo el arte se dibuja por código sobre un lienzo de 384x216.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 384, H = 216, CW = 24, CH = 32;
let FAST = false, SPEED = +(Q.get('speed') || 1), AUTO = Q.get('auto') === '1';
let WARP = +(Q.get('warp') || 0); const SNAP = Q.get('snap') === '1';   // solo para pruebas: saltar K turnos y capturar sin animación

// ---------- azar con semilla (motor) ----------
let seed = +(Q.get('seed') || (Date.now() % 1e9));
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const ri = n => Math.floor(rnd() * n);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = ri(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wait = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms / SPEED));
const rm = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; };

// ---------- paleta ----------
const C = { ink:'#1a1c2c', plum:'#5d275d', red:'#b13e53', orange:'#ef7d57', yellow:'#ffcd75', lime:'#a7f070', green:'#38b764', teal:'#257179',
  navy:'#29366f', blue:'#3b5dc9', sky:'#41a6f6', cyan:'#73eff7', white:'#f4f4f4', silver:'#94b0c2', slate:'#566c86', dusk:'#333c57',
  felt:'#15323a', felt2:'#183941', feltLine:'#21505a', black:'#0d0e16' };
const STYLE = {
  H:{ main:C.red, dark:C.plum, light:C.orange, paper:C.white, edge:C.dusk, shade:C.silver },
  R:{ main:C.blue, dark:C.navy, light:C.cyan, paper:C.white, edge:C.dusk, shade:C.silver },
  T:{ main:C.green, dark:C.teal, light:C.lime, paper:C.white, edge:C.dusk, shade:C.silver },
  M:{ main:C.yellow, dark:C.orange, light:C.white, paper:C.white, edge:C.dusk, shade:C.silver },
  JN:{ main:C.white, dark:C.silver, light:C.white, paper:C.ink, edge:C.slate, shade:C.black },
  JR:{ main:C.orange, dark:C.red, light:C.yellow, paper:'#fbe9c8', edge:C.red, shade:'#e2c79a' },
};

/* =====================================================================
   MOTOR DE REGLAS
   ===================================================================== */
const LET = { 11:'J', 12:'Q', 13:'K', 14:'A' };
const bv = c => c.r ? Math.min(c.r, 10) : 0;                 // valor en banco / defensa
const dv = c => (c.s === 'JN' || c.s === 'JR') ? 15 : c.r;   // valor en duelo de crítico
const total = b => b.reduce((s, c) => s + bv(c), 0);
const rem = L => L.card.r - L.dmg;
const isJoker = c => c.s === 'JN' || c.s === 'JR';
let G = null;

function payCombo(bank, cost){
  let best = null; const n = bank.length;
  for (let m = 1; m < (1 << n); m++){
    let s = 0, k = 0; for (let i = 0; i < n; i++) if (m >> i & 1){ s += bv(bank[i]); k++; }
    if (s >= cost && (!best || s < best.s || (s === best.s && k > best.k))) best = { s, m, k };
  }
  return best;
}
function pay(bank, cost){
  const b = payCombo(bank, cost); const out = [];
  for (let i = bank.length - 1; i >= 0; i--) if (b.m >> i & 1) out.push(bank.splice(i, 1)[0]);
  G.discard.push(...out); return out;
}

function newGame(n){
  let id = 0; const mk = (s, r) => ({ id: id++, s, r });
  const hearts = []; for (let r = 2; r <= 14; r++) hearts.push(mk('H', r)); shuffle(hearts);
  const deck = []; for (const s of 'RTM') for (let r = 2; r <= 14; r++) deck.push(mk(s, r));
  deck.push(mk('JN', 0), mk('JR', 0));
  const nl = { 2:6, 3:4, 4:3 }[n];
  const players = [];
  for (let p = 0; p < n; p++) players.push({ name: p === 0 ? 'TÚ' : 'CPU ' + p, human: p === 0, hand: [], lives: [], luck: [], money: [], alive: true, turns: 0, startLives: nl, tgt: null });
  for (const P of players) for (let i = 0; i < nl; i++) P.lives.push({ card: hearts.pop(), up: false, dmg: 0, att: [] });
  deck.push(...hearts); shuffle(deck);
  for (const P of players) for (let i = 0; i < 5; i++) P.hand.push(deck.pop());
  G = { n, players, deck, discard: [], cem: [], limbo: [], duel: null, first: ri(n), cur: 0, moves: 0, reshuffles: 0, sudden: false, streak: 0,
        over: false, winner: -1, byClock: false, pendingMult: null, defended: new Set(), log: [], ncards: id, stats: { kills: 0, turns: 0 } };
  G.cur = G.first;
  return G;
}
// log(texto, clave, extra): si la última línea tiene la misma clave, se le añade "extra" en vez de repetir la línea
function log(s, key, extra){ const last = G.log[G.log.length - 1];
  if (key && last && last.key === key && performance.now() - last.t < 9000){ last.s += ' · ' + extra; last.t = performance.now(); return; }
  G.log.push({ s, key, t: performance.now() }); if (G.log.length > 40) G.log.shift(); }
const cname = c => (LET[c.r] || c.r) + '';
const aliveCount = () => G.players.filter(P => P.alive).length;

async function endByClock(why){
  if (G.over) return;
  let best = -1, key = null;
  G.players.forEach((P, p) => { if (!P.alive) return; const k = [P.lives.length, P.lives.reduce((s, L) => s + rem(L), 0)];
    if (!key || k[0] > key[0] || (k[0] === key[0] && k[1] > key[1])){ key = k; best = p; } });
  G.over = true; G.winner = best; G.byClock = true; log('FIN POR RELOJ: ' + why);
  await V.banner('¡SE ACABÓ EL TIEMPO!', -1, 1300);
}
async function ensureDeck(){
  if (G.deck.length) return true;
  if (!G.discard.length){ await endByClock('NO QUEDAN CARTAS'); return false; }
  if (G.reshuffles >= 6){ await endByClock('7º REBARAJE'); return false; }
  G.reshuffles++; G.deck = shuffle(G.discard); G.discard = [];
  log('REBARAJE ' + G.reshuffles + '/7'); V.fxShuffle(); await wait(750);
  if (G.reshuffles >= 4 && !G.sudden){ G.sudden = true; log('☠ MUERTE SÚBITA: SIN DEFENSA'); await V.banner('MUERTE SÚBITA', -1, 1400); }
  return true;
}
async function drawCards(p, k){
  for (let i = 0; i < k; i++){
    if (G.over || !(await ensureDeck())) return;
    const c = G.deck.pop(); G.players[p].hand.push(c); V.fxDraw(c, p); await wait(150);
  }
}
async function flipFromDeck(){ if (!(await ensureDeck())) return null; return G.deck.pop(); }

async function killLife(tp, L, killer, steal){
  const D = G.players[tp]; if (!rm(D.lives, L)) return;
  V.fxKill(L, steal); G.stats.kills++;
  G.discard.push(...L.att); L.att = []; L.dmg = 0; L.up = true;
  if (steal){ G.players[killer].hand.push(L.card); log('✦ ' + G.players[killer].name + ' ROBA LA VIDA ' + L.card.r + ' DE ' + D.name); }
  else { G.cem.push(L.card); log('☠ VIDA ' + L.card.r + ' DE ' + D.name); }
  await wait(560);
  if (D.lives.length === 0){
    D.alive = false; const K = G.players[killer];
    K.luck.push(...D.luck); K.money.push(...D.money); D.luck = []; D.money = [];
    G.discard.push(...D.hand); D.hand = [];
    log('☠ ' + D.name + ' ELIMINADO · BOTÍN PARA ' + (K.human ? 'TI' : K.name)); V.fxElim(tp);
    await V.banner(D.human ? 'HAS SIDO ELIMINADO' : D.name + ' ELIMINADO', tp, 1200);
    if (aliveCount() === 1){ G.over = true; G.winner = G.players.findIndex(P => P.alive); }
  } else { await drawCards(tp, 1); }   // adrenalina
}

async function critDuel(p, dp, tier){
  G.duel = { a: [], d: [], p, dp, res: null, best: null, tier, t0: performance.now() };
  V.sfx('duel'); await wait(450);
  const reveal = async (c, side, suspense) => { c._shown = false; G.duel[side].push(c); V.fxSuspense(c, suspense); await wait(suspense); c._shown = true; V.fxReveal(c); await wait(330); };
  for (let i = 0; i < tier; i++){ const c = await flipFromDeck(); if (c) await reveal(c, 'a', 420 + i * 60); }
  const best = Math.max(0, ...G.duel.a.map(dv)); G.duel.best = G.duel.a.find(c => dv(c) === best) || null;
  const dc = await flipFromDeck(); if (dc) await reveal(dc, 'd', 800);
  const def = G.duel.d.length ? dv(G.duel.d[0]) : 0;
  const ok = G.duel.a.length > 0 && best >= def;
  const mult = ok ? (tier === 3 ? 3 : 2) : 1;
  G.duel.res = ok ? 'X' + mult : 'FALLO'; G.duel.tRes = performance.now();
  log(ok ? '✦ ¡CRÍTICO X' + mult + '!' : 'FALLA EL CRÍTICO'); V.fxCrit(ok);
  await wait(1250);
  for (const c of [...G.duel.a, ...G.duel.d]) delete c._shown;
  G.discard.push(...G.duel.a, ...G.duel.d); G.duel = null;
  return mult;
}

function stealTop2(from, to){ from.sort((a, b) => bv(a) - bv(b)); let k = 0; while (from.length && k < 2){ to.push(from.pop()); k++; } return k; }

// Ataque: una o varias cartas de rayo contra una vida (combinado), o una K repartida entre dos.
async function doAttack(p, cards, targets){
  const P = G.players[p]; const n = cards.length;
  cards.forEach((c, i) => { rm(P.hand, c); G.limbo.push(c); c._life = targets[0].life; c._tp = targets[0].p; c._slot = i; c._n = n; });
  G.moves -= n; V.sfx('play');
  let mult = 1;
  if (G.pendingMult){
    const pm = G.pendingMult; G.pendingMult = null;
    if (pm.kind === 'money') mult = 2; else mult = await critDuel(p, targets[0].p, pm.tier);
    if (G.over){ for (const c of cards){ rm(G.limbo, c); G.discard.push(c); } return; }
  }
  const sum = cards.reduce((s, c) => s + c.r, 0), hi = Math.max(...cards.map(c => c.r));
  const totalVal = sum + hi * (mult - 1);                       // el multiplicador se aplica a la carta más alta
  if (targets.length === 1) targets[0].amount = totalVal; else targets.forEach(t => { t.amount *= mult; });
  let hiDone = false; const contrib = cards.map(c => (c.r === hi && !hiDone) ? (hiDone = true, c.r * mult) : c.r);   // lo que aporta cada carta al contador
  const desc = cards.map(cname).join('+') + (mult > 1 ? ' X' + mult : '');
  log(P.name + ' ⚡ ' + desc, 'atk' + p + ':' + G.stats.turns, desc);
  let attachedTo = null;
  for (const t of targets){
    if (G.over) break; const L = t.life, D = G.players[t.p]; if (!D.lives.includes(L)) continue;
    cards.forEach(c => { c._life = L; c._tp = t.p; }); V.fxAim(L); await wait(380);
    if (!L.up){ L.up = true; V.fxReveal(L.card); await wait(420); }
    let val = t.amount, blocked = null; const raw = val;
    if (!G.sudden && !G.defended.has(t.p) && val > 0 && D.hand.some(c => c.s === 'T')){
      if (D.human && !AUTO){ V.hitIncoming(L, val); if (TUT.on) await TUT.sync('defend'); }
      const club = (D.human && !AUTO) ? await UI.askDefense({ val, life: L, from: p }) : (TUT.on ? null : aiDefense(t.p, val, L));
      if (club){ rm(D.hand, club); G.defended.add(t.p); blocked = club; club._life = L; club._tp = t.p; club._slot = 0; club._n = 1; G.limbo.push(club); val = Math.max(0, val - bv(club)); }
      if (D.human && !AUTO && TUT.on){ TUT.advance({ type: 'defend', card: club }); }
    }
    // golpes: el contador sube carta a carta; con reparto de K, un solo golpe con la parte asignada
    V.hitStart(L, mult > 1);
    for (let i = 0; i < n; i++){ V.fxStrike(cards[i], L, targets.length > 1 ? raw : contrib[i], i, raw > 0); await wait(n > 1 ? 190 : 260); }
    if (blocked){ log(D.name + ' ♣ BLOQUEA ' + bv(blocked)); V.fxShield(L, bv(blocked), val); await wait(620); rm(G.limbo, blocked); }
    if (val >= rem(L)){
      if (blocked) G.discard.push(blocked);
      await killLife(t.p, L, p, cards.some(c => c.r === 14));
      if (cards.some(c => c.r === 11)){ const k = stealTop2(D.luck, P.luck); if (k){ log(P.name + ' ROBA ' + k + ' ♣ A ' + D.name); V.fxSteal(p, 'T', k); await wait(300); } }
      if (cards.some(c => c.r === 12)){ const k = stealTop2(D.money, P.money); if (k){ log(P.name + ' ROBA ' + k + ' ● A ' + D.name); V.fxSteal(p, 'M', k); await wait(300); } }
    } else {
      L.dmg += val; if (blocked) L.att.push(blocked); if (!attachedTo) attachedTo = L;
      V.fxDamage(L, val); await wait(380);
    }
  }
  const alive = attachedTo && G.players.some(X => X.lives.includes(attachedTo));
  for (const c of cards){ rm(G.limbo, c); c._life = null; if (alive) attachedTo.att.push(c); else G.discard.push(c); }
}

async function perform(p, a){
  const P = G.players[p]; if (a.type !== 'bank') G.streak = 0;
  switch (a.type){
    case 'place': rm(P.hand, a.card); P.lives.push({ card: a.card, up: false, dmg: 0, att: [] }); G.moves--; log(P.name + ' ♥ NUEVA VIDA'); V.fxPlace(a.card); await wait(400); return true;
    case 'bank': rm(P.hand, a.card); (a.card.s === 'T' ? P.luck : P.money).push(a.card); G.moves--; const ic = a.card.s === 'T' ? '♣' : '●'; log(P.name + ' ' + ic + ' +' + bv(a.card), 'bank' + p + ic + G.stats.turns, '+' + bv(a.card)); V.fxBank(a.card, G.streak++); await wait(360); return true;
    case 'luck': V.fxPay(pay(P.luck, a.tier * 10)); G.pendingMult = { kind: 'luck', tier: a.tier }; G.moves--; log(P.name + ' ♣ -' + a.tier * 10 + ' ► CRÍTICO'); await wait(480); return true;
    case 'money':
      V.fxPay(pay(P.money, a.tier * 10)); G.moves--;
      if (a.tier === 1){ log(P.name + ' ● -10 ► ROBA 2'); await wait(320); await drawCards(p, 2); }
      else if (a.tier === 2){ G.pendingMult = { kind: 'money' }; log(P.name + ' ● -20 ► RAYO X2'); await wait(480); }
      else { rm(G.cem, a.pick); P.lives.push({ card: a.pick, up: false, dmg: 0, att: [] }); log(P.name + ' ● -30 ► REVIVE ' + a.pick.r); V.fxRevive(a.pick); await wait(700); }
      return true;
    case 'jokerRed':
      rm(P.hand, a.card); G.discard.push(a.card); G.moves--;
      if (a.pick){ rm(G.cem, a.pick); P.lives.push({ card: a.pick, up: false, dmg: 0, att: [] }); log(P.name + ' ✦ REVIVE ' + a.pick.r); V.fxRevive(a.pick); await wait(700); }
      else { log(P.name + ' ✦ ROBA 2'); await wait(250); await drawCards(p, 2); }
      return true;
    case 'jokerBlack': {
      rm(P.hand, a.card); G.limbo.push(a.card); a.card._life = a.t1.life; a.card._tp = a.t1.p; a.card._slot = 0; a.card._n = 1; G.moves--; V.sfx('play');
      log(P.name + ' ✦ COMODÍN NEGRO'); await wait(480);
      const ts = [a.t1]; if (a.t2 && a.k){ rm(P.hand, a.k); G.discard.push(a.k); G.moves--; ts.push(a.t2); }
      for (const t of ts){ if (G.over) break; if (!G.players[t.p].lives.includes(t.life)) continue;
        a.card._life = t.life; a.card._tp = t.p; V.fxAim(t.life); await wait(380); if (!t.life.up){ t.life.up = true; V.fxReveal(t.life.card); await wait(340); }
        V.hitStart(t.life, false); V.fxStrike(a.card, t.life, 0, 0, true, true); await wait(300); await killLife(t.p, t.life, p, false); }
      rm(G.limbo, a.card); a.card._life = null; G.discard.push(a.card); return true; }
    case 'attack': await doAttack(p, a.cards || [a.card], a.targets); return true;
  }
  return false;
}

async function playTurn(p){
  const P = G.players[p]; G.moves = 0; G.pendingMult = null; G.defended = new Set(); G.stats.turns++; G.streak = 0;
  if (P.human) await V.banner('TU TURNO', p, 850); else { V.fxTurn(p); await wait(420); }   // los rivales no interrumpen con cartel: se marca su placa
  await drawCards(p, 2); if (G.over) return;
  G.moves = (P.turns === 0 && p === G.first && !TUT.on) ? 1 : 3;
  let guard = 0;
  if (P.human && TUT.on) await TUT.sync('turn');
  while (G.moves > 0 && !G.over && P.alive && guard++ < 12){
    const a = (P.human && !AUTO) ? await UI.getAction() : (await wait(560), aiAction(p));
    if (!a || a.type === 'end'){ if (P.human && TUT.on && a && !G.over){ TUT.advance(a); await TUT.sync('turn'); } break; }
    if (!(await perform(p, a))) break;
    if (P.human && TUT.on){ TUT.advance(a); if (!G.over) await TUT.sync('turn'); }
  }
  if (G.pendingMult){ log('SE PIERDE EL MULTIPLICADOR'); G.pendingMult = null; }
  G.moves = 0;
  while (P.alive && !G.over && P.hand.length > 7){
    const c = (P.human && !AUTO) ? await UI.askDiscard() : aiDiscard(p);
    rm(P.hand, c); G.discard.push(c); V.sfx('draw'); await wait(160);
  }
  P.turns++;
}
async function runGame(){
  if (WARP){ FAST = true; AUTO = true; }
  await wait(1700);
  while (!G.over){
    if (WARP && G.stats.turns >= WARP && G.cur === 0){ WARP = 0; FAST = false; AUTO = Q.get('auto') === '1';
      if (Q.get('cheat')){ const P = G.players[0]; for (const c of G.deck.filter(c => c.s === 'T').slice(0, 4)){ rm(G.deck, c); P.luck.push(c); } for (const c of G.deck.filter(c => c.s === 'R').slice(0, 3)){ rm(G.deck, c); P.hand.unshift(c); } } }
    await playTurn(G.cur); if (G.over) break;
    do { G.cur = (G.cur + 1) % G.n; } while (!G.players[G.cur].alive);
  }
}

// ---------- IA ----------
const canAttack = p => G.players[p].turns > 0 && G.players.some((X, i) => i !== p && X.alive && X.lives.length);
function lifeScore(L){ return L.up ? rem(L) : 8; }
function aiTarget(p){
  const P = G.players[p]; const ok = q => q !== p && G.players[q].alive && G.players[q].lives.length;
  if (P.tgt === null || !ok(P.tgt)){ const opp = G.players.map((_, i) => i).filter(ok); P.tgt = opp.length ? opp[ri(opp.length)] : null; }
  return P.tgt;
}
function aiPickAttack(p, forced){
  const P = G.players[p], H = P.hand, t = aiTarget(p); if (t === null) return null;
  const Ls = G.players[t].lives; const m = total(P.money), lk = total(P.luck);
  const jn = H.find(c => c.s === 'JN');
  if (!forced && jn){
    const best = arr => arr.reduce((a, b) => lifeScore(b) > lifeScore(a) ? b : a);
    const l1 = best(Ls); const act = { type: 'jokerBlack', card: jn, t1: { p: t, life: l1 } };
    const k = H.find(c => c.s === 'R' && c.r === 13);
    if (k && G.moves >= 2){
      let pool = [];
      if (G.n === 2 || aliveCount() === 2) pool = Ls.filter(L => L !== l1).map(L => ({ p: t, life: L }));
      else G.players.forEach((X, q) => { if (q !== p && q !== t && X.alive) X.lives.forEach(L => pool.push({ p: q, life: L })); });

  const ph = 7 + lines.length * 9 + (cards.length ? CH + 6 : 0) + (isTap ? 13 : 2); const x0 = (W - pw) / 2 | 0; const y0 = st.pos === 'top' ? 4 : st.pos === 'low' ? 150 : 72;
  panel(x0, y0, pw, ph, C.ink, isTap ? C.yellow : C.sky); let y = y0 + 5; lines.forEach(([l, i]) => { drawText(l, W / 2, y, i === 0 ? C.yellow : C.white, { align: 'center' }); y += 9; });
  if (cards.length){ cards.forEach(([s, r], i) => { const key = s + r; let c = TUTC.get(key); if (!c){ c = { id: 950 + TUTC.size, s, r }; TUTC.set(key, c); } drawCardAt(c, W / 2 - (cards.length * 28 - 4) / 2 + i * 28, y + 1, 1, {}); }); y += CH + 6; }
  if (isTap) button(W / 2 - 34, y0 + ph - 12, 68, 9, st.final ? '¡A JUGAR! ►' : 'SIGUIENTE ►', true, st.final ? 'tutplay' : 'tutnext', undefined, C.green, true);
  else drawText('▲ HAZLO TÚ', x0 + pw - 5, y0 + ph - 8, (NOW / 400 | 0) % 2 ? C.sky : C.slate, { align: 'right' });
  drawText((TUT.i + 1) + '/' + TUT.steps.length, x0 + 4, y0 + ph - 8, C.slate);
}

/* ---------- autoprueba del motor: ?selftest=N&players=K ---------- */
async function selftest(N, n){
  FAST = true; AUTO = true; const out = { games: N, players: n, wins: {}, rounds: [], clock: 0, errors: [], badCount: 0 };
  for (let i = 0; i < N; i++){ try { newGame(n); let guard = 0;
      while (!G.over && guard++ < 4000){ await playTurn(G.cur); if (countCards() !== G.ncards) out.badCount++; if (G.over) break; do { G.cur = (G.cur + 1) % G.n; } while (!G.players[G.cur].alive); }
      if (!G.over) out.errors.push('sin final, semilla ' + i); out.wins[G.winner] = (out.wins[G.winner] || 0) + 1; out.rounds.push(Math.max(...G.players.map(P => P.turns))); if (G.byClock) out.clock++;
    } catch (e){ out.errors.push(String(e && e.stack || e)); } }
  out.rounds.sort((a, b) => a - b); out.median = out.rounds[out.rounds.length >> 1]; out.p90 = out.rounds[Math.floor(out.rounds.length * .9)]; delete out.rounds;
  cv.style.display = 'none'; const pre = document.createElement('pre'); pre.id = 'out'; pre.textContent = JSON.stringify(out, null, 1); document.body.appendChild(pre);
}

BACK = buildBack(); VIG = buildVig();
if (Q.get('selftest')) selftest(+Q.get('selftest'), +(Q.get('players') || 2));
else { requestAnimationFrame(frame); if (Q.get('rivals')) startGame(+Q.get('rivals'));
  if (Q.get('clicks')) Q.get('clicks').split(';').forEach(s => { const m = s.split('@'), xy = m[0].split(','); setTimeout(() => { tick(performance.now()); onClick(+xy[0], +xy[1]); tick(performance.now()); }, +m[1]); });
  if (Q.get('drag')){ const m = Q.get('drag').split('@'), v = m[0].split(',').map(Number); const ev = (type, x, y) => { const r = cv.getBoundingClientRect(); const o = { clientX: r.left + x / W * r.width, clientY: r.top + y / H * r.height, pointerId: 1, pointerType: 'mouse', bubbles: true }; (type === 'pointerup' ? window : cv).dispatchEvent(new PointerEvent(type, o)); tick(performance.now()); };
    setTimeout(() => { tick(performance.now()); ev('pointerdown', v[0], v[1]); for (let i = 1; i <= 6; i++) ev('pointermove', v[0] + (v[2] - v[0]) * i / 6, v[1] + (v[3] - v[1]) * i / 6); if (m[2] !== 'hold') ev('pointerup', v[2], v[3]); }, +m[1]); }
  if (Q.get('hover')){ const m = Q.get('hover').split('@'), xy = m[0].split(','); setTimeout(() => { tick(performance.now()); onMove(+xy[0], +xy[1]); }, +m[1]); } }
</script>
