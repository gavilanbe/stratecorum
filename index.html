<div id="rot"><b>📱</b>GIRA EL MÓVIL<br><small style="color:#94b0c2">EL JUEGO ES APAISADO</small></div>
<canvas id="c" width="384" height="216"></canvas>
<script>
'use strict';
/* =====================================================================
   STRATECORUM · reglas v2 · baraja propia (corazón, rayo, trébol, moneda)
   Todo el arte se dibuja por código sobre un lienzo de 384x216.
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const W = 384, H = 216, CW = 24, CH = 32;
let FAST = false, SPEED = +(Q.get('speed') || 1), AUTO = Q.get('auto') === '1';
let WARP = +(Q.get('warp') || 0); const SNAP = Q.get('snap') === '1';   // solo para pruebas: saltar K turnos y capturar sin animación

// ---------- azar con semilla (motor) ----------
let seed = +(Q.get('seed') || (Date.now() % 1e9));
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const ri = n => Math.floor(rnd() * n);
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = ri(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const wait = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms / SPEED));
const rm = (arr, x) => { const i = arr.indexOf(x); if (i >= 0) arr.splice(i, 1); return i >= 0; };

// ---------- paleta ----------
const C = { ink:'#1a1c2c', plum:'#5d275d', red:'#b13e53', orange:'#ef7d57', yellow:'#ffcd75', lime:'#a7f070', green:'#38b764', teal:'#257179',
  navy:'#29366f', blue:'#3b5dc9', sky:'#41a6f6', cyan:'#73eff7', white:'#f4f4f4', silver:'#94b0c2', slate:'#566c86', dusk:'#333c57',
  felt:'#15323a', felt2:'#183941', feltLine:'#21505a', black:'#0d0e16' };
const STYLE = {
  H:{ main:C.red, dark:C.plum, light:C.orange, paper:C.white, edge:C.dusk, shade:C.silver },
  R:{ main:C.blue, dark:C.navy, light:C.cyan, paper:C.white, edge:C.dusk, shade:C.silver },
  T:{ main:C.green, dark:C.teal, light:C.lime, paper:C.white, edge:C.dusk, shade:C.silver },
  M:{ main:C.yellow, dark:C.orange, light:C.white, paper:C.white, edge:C.dusk, shade:C.silver },
  JN:{ main:C.white, dark:C.silver, light:C.white, paper:C.ink, edge:C.slate, shade:C.black },
  JR:{ main:C.orange, dark:C.red, light:C.yellow, paper:'#fbe9c8', edge:C.red, shade:'#e2c79a' },
};

/* =====================================================================
   MOTOR DE REGLAS
   ===================================================================== */
const LET = { 11:'J', 12:'Q', 13:'K', 14:'A' };
const bv = c => c.r ? Math.min(c.r, 10) : 0;                 // valor en banco / defensa
const dv = c => (c.s === 'JN' || c.s === 'JR') ? 15 : c.r;   // valor en duelo de crítico
const total = b => b.reduce((s, c) => s + bv(c), 0);
const rem = L => L.card.r - L.dmg;
const isJoker = c => c.s === 'JN' || c.s === 'JR';
let G = null;

function payCombo(bank, cost){
  let best = null; const n = bank.length;
  if (n > 14){ const idx = bank.map((c, i) => i).sort((a, b) => bv(bank[a]) - bv(bank[b])); let s = 0, m = 0, k = 0; for (const i of idx){ if (s >= cost) break; s += bv(bank[i]); m |= (1 << i); k++; } return { s, m, k }; }   // banco enorme (botín): pago voraz, de menor a mayor
  for (let m = 1; m < (1 << n); m++){
    let s = 0, k = 0; for (let i = 0; i < n; i++) if (m >> i & 1){ s += bv(bank[i]); k++; }
    if (s >= cost && (!best || s < best.s || (s === best.s && k > best.k))) best = { s, m, k };
  }
  return best;
}
function pay(bank, cost){
  const b = payCombo(bank, cost); const out = [];
  for (let i = bank.length - 1; i >= 0; i--) if (b.m >> i & 1) out.push(bank.splice(i, 1)[0]);
  G.discard.push(...out); return out;
}

let ME = 0;   // asiento del jugador local (en línea puede no ser el 0)
const SEAT_COL = [C.sky, C.orange, C.lime, C.plum];
let AI_LEVEL = Q.get('ai') || 'normal';   // 'easy' | 'normal' | 'hard'
let RULES = +(Q.get('rules') || 3);          // 2 = manual v2 · 3 = v3 (ocultar, reordenar, escudos y trampas, K acumulativa, J espía, Q desarma)
// kinds: por asiento, 'local' | 'remote' | 'cpu'. Sin kinds: asiento 0 local y el resto máquina.
function newGame(n, kinds, meSeat, ai, names, timer, rules, fair){
  ME = meSeat || 0; const seedAtStart = seed; kinds = kinds || Array.from({ length: n }, (_, p) => p === 0 ? 'local' : 'cpu');
  let id = 0; const mk = (s, r) => ({ id: id++, s, r });
  const hearts = []; for (let r = 2; r <= 14; r++) hearts.push(mk('H', r)); shuffle(hearts);
  const deck = []; for (const s of 'RTM') for (let r = 2; r <= 14; r++) deck.push(mk(s, r));
  deck.push(mk('JN', 0), mk('JR', 0));
  const nl = { 2:6, 3:4, 4:3 }[n];
  const players = [];
  const hot = kinds.filter(k => k === 'local').length > 1;
  for (let p = 0; p < n; p++) players.push({ name: kinds[p] === 'local' && !hot ? 'TÚ' : kinds[p] !== 'cpu' ? 'JUGADOR ' + (p + 1) : 'CPU ' + (p + 1), human: kinds[p] === 'local', remote: kinds[p] === 'remote', col: SEAT_COL[p % SEAT_COL.length], hand: [], lives: [], luck: [], money: [], alive: true, turns: 0, startLives: nl, tgt: null });
  for (const P of players) for (let i = 0; i < nl; i++) P.lives.push({ card: hearts.pop(), up: false, dmg: 0, att: [] });
  deck.push(...hearts); shuffle(deck);
  for (const P of players) for (let i = 0; i < 5; i++) P.hand.push(deck.pop());
  const byId = new Map(); for (const c of deck) byId.set(c.id, c); for (const P of players){ for (const c of P.hand) byId.set(c.id, c); for (const L of P.lives) byId.set(L.card.id, L.card); }
  G = { n, players, deck, discard: [], cem: [], limbo: [], duel: null, first: ri(n), cur: 0, seed0: seedAtStart, moves: 0, reshuffles: 0, sudden: false, streak: 0,
        over: false, winner: -1, byClock: false, pendingMult: null, defended: new Set(), log: [], ncards: id, byId, ai: ai || AI_LEVEL, hot, timer: timer || 0, v3: (rules || RULES) === 3, fair: fair === undefined ? true : !!fair, hist: [], stats: { kills: 0, turns: 0, ward: 0, shield: 0, trap: 0, disarm: 0, hide: 0, swap: 0, peek: 0, split: 0, buy: 0 } };
  if (names) names.forEach((nm, p) => { if (nm && players[p]) players[p].name = nm; });
  G.cur = G.first;
  if (G.fair) for (let k = 1; k < n; k++) players[(G.first + k) % n].hand.push(deck.pop());   // apertura justa: quien no empieza recibe 1 carta más
  return G;
}
// log(texto, clave, extra): si la última línea tiene la misma clave, se le añade "extra" en vez de repetir la línea
function log(s, key, extra){ const last = G.log[G.log.length - 1];
  if (key && last && last.key === key && performance.now() - last.t < 9000){ last.s += ' · ' + extra; last.t = performance.now(); return; }
  G.log.push({ s, key, t: performance.now() }); if (G.log.length > 40) G.log.shift(); }
const cname = c => (LET[c.r] || c.r) + '';
const aliveCount = () => G.players.filter(P => P.alive).length;

async function endByClock(why){
  if (G.over) return;
  let best = -1, key = null;
  G.players.forEach((P, p) => { if (!P.alive) return; const k = [P.lives.length, P.lives.reduce((s, L) => s + rem(L), 0)];
    if (!key || k[0] > key[0] || (k[0] === key[0] && k[1] > key[1])){ key = k; best = p; } });
  G.over = true; G.winner = best; G.byClock = true; log('FIN POR RELOJ: ' + why);
  await V.banner('¡SE ACABÓ EL TIEMPO!', -1, 1300);
}
async function ensureDeck(){
  if (G.deck.length) return true;
  if (!G.discard.length){ await endByClock('NO QUEDAN CARTAS'); return false; }
  if (G.reshuffles >= 6){ await endByClock('7º REBARAJE'); return false; }
  G.reshuffles++; G.deck = shuffle(G.discard); G.discard = [];
  log('REBARAJE ' + G.reshuffles + '/7'); V.fxShuffle(); await wait(750);
  if (G.reshuffles >= 4 && !G.sudden){ G.sudden = true; log('☠ MUERTE SÚBITA: SIN DEFENSA'); await V.banner('MUERTE SÚBITA', -1, 1400); }
  return true;
}
async function drawCards(p, k){
  for (let i = 0; i < k; i++){
    if (G.over || !(await ensureDeck())) return;
    const c = G.deck.pop(); G.players[p].hand.push(c); V.fxDraw(c, p); await wait(150);
  }
}
async function flipFromDeck(){ if (!(await ensureDeck())) return null; return G.deck.pop(); }

async function killLife(tp, L, killer, steal){
  const D = G.players[tp]; if (!rm(D.lives, L)) return;
  V.fxKill(L, steal); G.stats.kills++;
  G.discard.push(...L.att); L.att = []; L.dmg = 0; L.up = true; L.known = false; if (L.ward){ G.discard.push(L.ward.card); L.ward = null; } L.seen = null;
  if (steal){ G.players[killer].hand.push(L.card); log('✦ ' + G.players[killer].name + ' ROBA LA VIDA ' + L.card.r + ' DE ' + D.name); }
  else { G.cem.push(L.card); log('☠ VIDA ' + L.card.r + ' DE ' + D.name); }
  await wait(480);
  if (D.lives.length === 0){
    D.alive = false; const K = G.players[killer];
    K.luck.push(...D.luck); K.money.push(...D.money); D.luck = []; D.money = [];
    G.discard.push(...D.hand); D.hand = [];
    log('☠ ' + D.name + ' ELIMINADO · BOTÍN PARA ' + (K.human ? 'TI' : K.name)); V.fxElim(tp);
    await V.banner(D.human ? 'HAS SIDO ELIMINADO' : D.name + ' ELIMINADO', tp, 1200);
    if (aliveCount() === 1){ G.over = true; G.winner = G.players.findIndex(P => P.alive); }
  } else { await drawCards(tp, 1); }   // adrenalina
}

async function critDuel(p, dp, tier){
  G.duel = { a: [], d: [], p, dp, res: null, best: null, tier, t0: performance.now() };
  V.sfx('duel'); await wait(450);
  const reveal = async (c, side, suspense) => { c._shown = false; G.duel[side].push(c); V.fxSuspense(c, suspense); await wait(suspense); c._shown = true; V.fxReveal(c); await wait(330); };
  for (let i = 0; i < tier; i++){ const c = await flipFromDeck(); if (c) await reveal(c, 'a', 420 + i * 60); }
  const best = Math.max(0, ...G.duel.a.map(dv)); G.duel.best = G.duel.a.find(c => dv(c) === best) || null;
  const dc = await flipFromDeck(); if (dc) await reveal(dc, 'd', 800);
  const def = G.duel.d.length ? dv(G.duel.d[0]) : 0;
  const ok = G.duel.a.length > 0 && best >= def;
  const mult = ok ? (tier === 3 ? 3 : 2) : 1;
  G.duel.res = ok ? 'X' + mult : 'FALLO'; G.duel.tRes = performance.now();
  log(ok ? '✦ ¡CRÍTICO X' + mult + '!' : 'FALLA EL CRÍTICO'); V.fxCrit(ok);
  await wait(1250);
  for (const c of [...G.duel.a, ...G.duel.d]) delete c._shown;
  G.discard.push(...G.duel.a, ...G.duel.d); G.duel = null;
  return mult;
}

function stealTop2(from, to){ from.sort((a, b) => bv(a) - bv(b)); let k = 0; while (from.length && k < 2){ to.push(from.pop()); k++; } return k; }

// Ataque: una o varias cartas de rayo contra una vida (combinado), o una K repartida entre dos.
async function doAttack(p, cards, targets){
  const P = G.players[p]; const n = cards.length;
  cards.forEach((c, i) => { rm(P.hand, c); G.limbo.push(c); c._life = targets[0].life; c._tp = targets[0].p; c._slot = i; c._n = n; });
  G.moves -= n; V.sfx('play');
  let mult = 1;
  if (G.pendingMult){
    const pm = G.pendingMult; G.pendingMult = null;
    if (pm.kind === 'money') mult = 2; else mult = await critDuel(p, targets[0].p, pm.tier);
    if (G.over){ for (const c of cards){ rm(G.limbo, c); G.discard.push(c); } return; }
  }
  const sum = cards.reduce((s, c) => s + c.r, 0), hi = Math.max(...cards.map(c => c.r));
  const whole = G.v3 && mult === 3;                              // v3: el x3 de la suerte va a todo el combo
  const totalVal = whole ? sum * 3 : sum + hi * (mult - 1);      // si no, el multiplicador se aplica a la carta más alta
  if (targets.length === 1) targets[0].amount = totalVal; else { G.stats.split++; const a0 = Math.max(1, Math.min(totalVal - 1, Math.round(targets[0].amount * totalVal / sum))); targets[0].amount = a0; targets[1].amount = totalVal - a0; }   // reparto declarado sobre la suma, escalado
  let hiDone = false; const contrib = cards.map(c => whole ? c.r * 3 : (c.r === hi && !hiDone) ? (hiDone = true, c.r * mult) : c.r);   // lo que aporta cada carta al contador
  const hasQ = cards.some(c => c.r === 12);
  const desc = cards.map(cname).join('+') + (mult > 1 ? ' X' + mult : '');
  log(P.name + ' ⚡ ' + desc, 'atk' + p + ':' + G.stats.turns, desc);
  let attachedTo = null;
  for (const t of targets){
    if (G.over) break; const L = t.life, D = G.players[t.p]; if (!D.lives.includes(L)) continue;
    cards.forEach(c => { c._life = L; c._tp = t.p; }); V.fxAim(L); V.fxCharge(cards, L, n > 1 || mult > 1); await wait(n > 1 || mult > 1 ? 440 : 360);
    if (!L.up){ L.up = true; V.fxReveal(L.card); await wait(340); }
    let val = t.amount, blocked = null;
    if (G.v3 && L.ward){ const w = L.ward; L.ward = null; const kind = w.card.s === 'R' ? 'trap' : 'shield';   // bajo la vida: trébol = escudo, rayo = trampa
      G.stats[hasQ ? 'disarm' : kind]++;
      if (hasQ){ G.discard.push(w.card); log(D.name + ': ' + (kind === 'trap' ? 'TRAMPA' : 'ESCUDO') + ' DESARMADO POR LA Q'); V.fxWard(L, 'disarm', bv(w.card)); await wait(600); }
      else if (kind === 'shield'){ G.discard.push(w.card); val = Math.max(0, val - bv(w.card)); log(D.name + ' ⛨ ESCUDO ' + bv(w.card)); V.fxWard(L, 'shield', bv(w.card)); await wait(650); }
      else { await springTrap(w.card, L, t.p, p); if (G.over) break; if (TUT.on && D.human) await TUT.sync('trap'); } }
    const raw = val;
    if (!G.sudden && !G.defended.has(t.p) && val > 0 && D.hand.some(c => c.s === 'T')){
      if (D.human && G.hot && t.p !== ME && !AUTO) await V.pass(t.p, D.name + ': ¡TE ATACAN CON ' + val + '!');
      if ((D.human && !AUTO) || D.remote){ V.hitIncoming(L, val); if (TUT.on) await TUT.sync('defend'); }
      const club = TUT.on && !D.human ? null : await decide(t.p, 'defend', { val, life: L, from: p });
      if (club){ rm(D.hand, club); G.defended.add(t.p); blocked = club; club._life = L; club._tp = t.p; club._slot = 0; club._n = 1; G.limbo.push(club); val = Math.max(0, val - bv(club)); }
      if (D.human && !AUTO && TUT.on){ TUT.advance({ type: 'defend', card: club }); }
    }
    // golpes: el contador sube carta a carta; con reparto de K, un solo golpe con la parte asignada
    V.fxWindup(cards, L); await wait(110); V.hitStart(L, mult > 1);
    for (let i = 0; i < n; i++){ V.fxStrike(cards[i], L, targets.length > 1 ? raw : contrib[i], i, raw > 0); await wait(n > 1 ? 180 : 240); }
    if (blocked){ log(D.name + ' ♣ BLOQUEA ' + bv(blocked)); V.fxShield(L, bv(blocked), val); await wait(620); rm(G.limbo, blocked); }
    if (val >= rem(L)){
      if (blocked) G.discard.push(blocked);
      await killLife(t.p, L, p, cards.some(c => c.r === 14));
      if (!G.v3 && cards.some(c => c.r === 11)){ const k = stealTop2(D.luck, P.luck); if (k){ log(P.name + ' ROBA ' + k + ' ♣ A ' + D.name); V.fxSteal(p, 'T', k); await wait(300); } }
      if (cards.some(c => c.r === 12)){ const suit = G.v3 ? (total(D.money) >= total(D.luck) ? 'M' : 'T') : 'M'; const k = stealTop2(suit === 'M' ? D.money : D.luck, suit === 'M' ? P.money : P.luck); if (k){ log(P.name + ' ROBA ' + k + (suit === 'M' ? ' ● A ' : ' ♣ A ') + D.name); V.fxSteal(p, suit, k); await wait(300); } }
    } else {
      L.dmg += val; if (blocked) L.att.push(blocked); if (!attachedTo) attachedTo = L;
      V.fxDamage(L, val); await wait(320);
    }
  }
  const alive = attachedTo && G.players.some(X => X.lives.includes(attachedTo));
  for (const c of cards){ rm(G.limbo, c); c._life = null; if (alive) attachedTo.att.push(c); else G.discard.push(c); }
  // v3: la J revela una vida oculta de cada rival golpeado (con K repartida entre dos rivales, una de cada uno)
  if (G.v3 && !G.over && cards.some(c => c.r === 11)) for (const tp of [...new Set(targets.map(t => t.p))]){ const D = G.players[tp]; if (!D.alive || !D.lives.some(L => !L.up)) continue;
    const L2 = await decide(p, 'peek', { tp }); if (L2 && D.lives.includes(L2) && !L2.up){ L2.up = true; L2.known = false; G.stats.peek++; log(P.name + ' ✦ J REVELA LA VIDA ' + L2.card.r + ' DE ' + D.name); V.fxReveal(L2.card); V.fxPeek(L2, p); await wait(700); } }
}

// Trampa: el rayo boca abajo salta contra la vida revelada más débil del atacante (o una oculta si no hay), se puede bloquear, y se queda debajo como daño
async function springTrap(card, L, owner, attacker){
  const A = G.players[attacker], D = G.players[owner]; const tv = card.r;
  const tgt = A.lives.filter(x => x.up).sort((a, b) => rem(a) - rem(b))[0] || A.lives[0];
  if (!tgt){ G.discard.push(card); return; }
  card._life = tgt; card._tp = attacker; card._slot = 0; card._n = 1; G.limbo.push(card);
  log(D.name + ' ◎ TRAMPA: RAYO ' + cname(card) + ' CONTRA ' + A.name); V.fxWard(L, 'trap', tv); await wait(520); V.fxAim(tgt); await wait(380);
  if (!tgt.up){ tgt.up = true; V.fxReveal(tgt.card); await wait(340); }
  let cv = tv, cb = null;
  if (!G.sudden && !G.defended.has(attacker) && A.hand.some(c => c.s === 'T')){
    if (A.human && G.hot && attacker !== ME && !AUTO) await V.pass(attacker, A.name + ': ¡TE ATACAN CON ' + cv + '!');
    if ((A.human && !AUTO) || A.remote) V.hitIncoming(tgt, cv);
    const club = TUT.on && !A.human ? null : await decide(attacker, 'defend', { val: cv, life: tgt, from: owner });
    if (club){ rm(A.hand, club); G.defended.add(attacker); cb = club; club._life = tgt; club._tp = attacker; club._slot = 0; club._n = 1; G.limbo.push(club); cv = Math.max(0, cv - bv(club)); }
  }
  V.fxWindup([card], tgt); await wait(120); V.hitStart(tgt, false); V.fxStrike(card, tgt, tv, 0, cv > 0, false, 'trap'); await wait(300);
  if (cb){ log(A.name + ' ♣ BLOQUEA ' + bv(cb)); V.fxShield(tgt, bv(cb), cv); await wait(620); rm(G.limbo, cb); }
  rm(G.limbo, card); card._life = null;
  if (cv >= rem(tgt)){ if (cb) G.discard.push(cb); G.discard.push(card); await killLife(attacker, tgt, owner, false); }
  else { tgt.dmg += cv; if (cb) tgt.att.push(cb); tgt.att.push(card); V.fxDamage(tgt, cv); await wait(380); }
}
async function perform(p, a){
  const P = G.players[p]; if (a.type !== 'bank') G.streak = 0;
  switch (a.type){

function buildLogo(){ const Z = 3, D = 4, out = [];
  for (const ch of 'STRATECORUM'){ const rows = LOGO_F[ch], mw = rows[0].length * Z, mh = rows.length * Z; const c = document.createElement('canvas'); c.width = mw + 2; c.height = mh + D + 2; const g = c.getContext('2d');
    const on = (x, y) => x >= 0 && y >= 0 && x < mw && y < mh && rows[Math.floor(y / Z)][Math.floor(x / Z)] === '#';
    for (let d = D; d >= 1; d--) for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (on(x, y)){ g.fillStyle = d > 2 ? '#2a1030' : C.plum; g.fillRect(x + 1, y + 1 + d, 1, 1); }   // extrusión
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) if (on(x, y)){ const k = y / mh; let col = k < .12 ? C.white : k < .42 ? '#ffe39a' : k < .7 ? C.yellow : k < .88 ? C.orange : '#c95a3c';
      if (!on(x, y - 1)) col = C.white; else if (!on(x - 1, y) && k < .6) col = '#fff4d0'; else if ((!on(x + 1, y) || !on(x, y + 1)) && k > .3) col = k > .7 ? '#b24a34' : C.orange;
      g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1); }
    const img = g.getImageData(0, 0, c.width, c.height), dd = img.data, w2 = c.width, h2 = c.height, a = i => dd[i * 4 + 3] > 0, add = [];
    for (let y = 0; y < h2; y++) for (let x = 0; x < w2; x++){ const i = y * w2 + x; if (a(i)) continue; if ((x > 0 && a(i - 1)) || (x < w2 - 1 && a(i + 1)) || (y > 0 && a(i - w2)) || (y < h2 - 1 && a(i + w2))) add.push(x, y); }
    g.fillStyle = C.ink; for (let k = 0; k < add.length; k += 2) g.fillRect(add[k], add[k + 1], 1, 1);
    out.push({ ch, c, w: c.width, h: c.height, glow: tinted(c, C.white) }); }
  let x = 0; for (const L of out){ L.x = x; x += L.w - 1; } out.total = x; return out; }

}
